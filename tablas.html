<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
    <style>
        table,td,th { border: 2px solid black;
      border-collapse: collapse;
        }
    </style>
</head>
<body>
    <h1>Tablas</h1>
    <table>
    <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Edad</th>
    </tr>
    <tr>
            <th>mamadu</th>
            <th>pepe</th>
            <td>33</th>
    </tr>
    <tr>
            <th>carlos</th>
            <th>sahur</th>
            <td>23</th>
    </tr>
    </table>
    <h1>caption y rowsapn</h1>
    <table>
        <caption>telefonos</caption>
        <tr>
            <th>Nombre</th>
            <th colorspan="2">Telefono</th>
        </tr>
        <tr>
            <td>Carlos perreira</td>
            <td>678382957</td>
            <td>748139013</td>
        </tr>
    </table>
    <h1>rowspan</h1>
    
</body>
</html>
